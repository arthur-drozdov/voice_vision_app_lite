name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://voicevision.sonnia.ai/ \
            --delete \
            --region us-east-1 \
            --cache-control "max-age=300,public"
          echo "Full dist/ synced to S3 (including ONNX/WASM/VAD files)"

      - name: Set long cache for static assets
        run: |
          aws s3 cp s3://voicevision.sonnia.ai/backgrounds/ s3://voicevision.sonnia.ai/backgrounds/ \
            --recursive --region us-east-1 \
            --cache-control "max-age=86400,public" \
            --metadata-directive REPLACE 2>/dev/null || true
          aws s3 cp s3://voicevision.sonnia.ai/planets/ s3://voicevision.sonnia.ai/planets/ \
            --recursive --region us-east-1 \
            --cache-control "max-age=86400,public" \
            --metadata-directive REPLACE 2>/dev/null || true

      - name: Fix MIME types for JS/WASM modules
        run: |
          # .mjs files must be text/javascript (not binary/octet-stream)
          aws s3 ls s3://voicevision.sonnia.ai/ --recursive --region us-east-1 | \
            awk '{print $NF}' | grep '\.mjs$' | while read key; do
              aws s3 cp "s3://voicevision.sonnia.ai/$key" "s3://voicevision.sonnia.ai/$key" \
                --region us-east-1 --content-type "text/javascript" \
                --metadata-directive REPLACE --cache-control "max-age=300,public"
            done
          # .wasm files must be application/wasm
          aws s3 ls s3://voicevision.sonnia.ai/ --recursive --region us-east-1 | \
            awk '{print $NF}' | grep '\.wasm$' | while read key; do
              aws s3 cp "s3://voicevision.sonnia.ai/$key" "s3://voicevision.sonnia.ai/$key" \
                --region us-east-1 --content-type "application/wasm" \
                --metadata-directive REPLACE --cache-control "max-age=300,public"
            done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2ROL8YI61ZU6B \
            --paths "/*" \
            --region us-east-1
          echo "CloudFront invalidation triggered for /*"

      - name: Verify deploy
        run: |
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://voicevision.sonnia.ai/)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Deploy verification returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Deploy verified — HTTP 200"
